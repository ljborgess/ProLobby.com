services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: prolobby
      POSTGRES_PASSWORD: prolobby
      POSTGRES_DB: prolobby
    # Porta do host é sobrescrevível: outra stack na máquina pode já estar
    # ocupando a 5432. `POSTGRES_PORT=5442 docker compose up -d postgres`
    # resolve sem editar arquivo versionado — o container segue na 5432 por
    # dentro, então só o DATABASE_URL local muda.
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - prolobby-postgres-data:/var/lib/postgresql/data
      # Creates prolobby_e2e on a fresh volume. An existing volume keeps its
      # databases: `docker compose exec postgres createdb -U prolobby prolobby_e2e`.
      - ./scripts/postgres-init:/docker-entrypoint-initdb.d:ro

    # Production (ADR-009 / #121) is docker-compose.prod.yml — web, api, bot
    # and cloudflared, with NO `ports:` on any of them. This file stays the
    # local Postgres. The bot's POST /events is reached only on the internal
    # Docker network — never by the Cloudflare tunnel. HMAC (WEBHOOK_SECRET)
    # is still required if someone publishes the port or forwards a path.

volumes:
  prolobby-postgres-data:
