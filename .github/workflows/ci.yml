name: CI

on:
  push:
    branches: [dev, main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm format:check

      - run: pnpm turbo lint

      - run: pnpm turbo type-check

      - run: pnpm turbo build

      - run: pnpm turbo test

      - run: pnpm exec playwright install --with-deps chromium
        working-directory: apps/web

      - run: pnpm turbo e2e

      # Item 2 do checklist de segurança (docs/requisitos/08-seguranca-checklist.md):
      # dependência vulnerável entra pelo lockfile, não pelo código do PR.
      # --prod: o que roda em produção bloqueia o merge; advisory de dev dep
      # (vitest/vite) vira manutenção normal, não trava PR de regra de negócio.
      - run: pnpm audit --prod --audit-level=high
