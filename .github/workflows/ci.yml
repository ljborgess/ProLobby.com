name: CI

on:
  push:
    branches: [dev, main]
  pull_request:

# Nada neste pipeline escreve no repositório — só lê, instala e testa.
# Menor privilégio: um action comprometido não consegue push.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Segredo commitado por engano (token do bot, URL do Neon com senha) entra no
  # histórico e não sai mais com um commit novo. O repositório privado no plano
  # gratuito não tem secret scanning do GitHub, então a varredura fica aqui.
  # Imagem com versão fixa; o histórico inteiro é lido, e o achado sai mascarado.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Mesmo uid do runner: sem isso o git do contêiner recusa o repositório
      # montado ("dubious ownership"). Falso positivo conferido vai pro
      # .gitleaksignore, com o motivo.
      - run: docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --redact --no-banner

  lint-build-test:
    runs-on: ubuntu-latest

    # Mesmo usuario e senha do docker-compose.yml da raiz (banco: prolobby_e2e) — se divergirem, aparece o
    # "funciona local, quebra no CI" que esta issue existe pra evitar (#67).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: prolobby
          POSTGRES_PASSWORD: prolobby
          # _e2e: the suites refuse any other name (test/support/guard-database.ts).
          POSTGRES_DB: prolobby_e2e
        ports:
          - 5432:5432
        # Sem o health check o job começa a testar com o banco ainda subindo,
        # e a falha é intermitente — a pior de diagnosticar.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://prolobby:prolobby@localhost:5432/prolobby_e2e
      # Descartavel e efemero no runner. O segredo real vive em variavel de
      # ambiente do deploy e forja sessao de qualquer conta (RNF-021).
      JWT_SECRET: ci-secret-not-the-placeholder
      WEBHOOK_SECRET: ci-webhook-secret-not-the-placeholder
      # 32 raw bytes, base64 — same discardable-runner rule as the two above.
      EVIDENCE_ENCRYPTION_KEY: 'MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE='
      IDENTITY_HMAC_SECRET: 'YWJjZGVmZ2hpamtsbW5vcHFyc3R1dnd4eXowMTIzNDU='

    steps:
      # Actions presas por hash de commit, com a versão no comentário: uma tag
      # pode ser movida por quem controla o repositório da action, o hash não.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Item 2 do checklist de segurança (docs/requisitos/08-seguranca-checklist.md):
      # dependência vulnerável entra pelo lockfile, não pelo código do PR.
      # --prod: o que roda em produção bloqueia o merge; advisory de dev dep
      # (vitest/vite) vira manutenção normal, não trava PR de regra de negócio.
      - run: pnpm audit --prod --audit-level=high

      - run: pnpm format:check

      - run: pnpm turbo lint

      - run: pnpm turbo type-check

      - run: pnpm turbo build

      - run: pnpm turbo test

      - run: pnpm exec playwright install --with-deps chromium
        working-directory: apps/web

      - run: pnpm turbo e2e

      # Sobe os dois processos de verdade e roda o roteiro que antes era manual:
      # login pelo proxy, painel da home, reenvio, início do vínculo, CSRF e as
      # rotas antigas respondendo 404. É o único ponto do pipeline em que web e
      # API conversam — cada suíte acima sobe a sua própria aplicação isolada, e
      # foi assim que uma renomeação de rota passou despercebida em 2026-09-21.
      #
      # Sem aplicativo do Discord configurado aqui, o passo do vínculo é pulado
      # pelo próprio script: a rota responder "indisponível" é o comportamento
      # correto neste ambiente.
      - name: Smoke com web e API no ar
        run: |
          pnpm --filter @prolobby/api mikro-orm migration:up
          # A partir de apps/api: o mikro-orm.config resolve `entities` em
          # ./dist/**, relativo ao diretorio atual — da raiz o boot morre com
          # "No entities were discovered" (visto no CI em 2026-09-21).
          # A porta vai em cada processo, nunca no `env:` do passo: um PORT
          # comum faria o Next subir na porta da API e o wait-on esperar para
          # sempre — foi o que aconteceu na primeira tentativa.
          (cd apps/api && PORT=3001 node dist/main.js) > /tmp/api.log 2>&1 &
          PORT=3000 pnpm --filter @prolobby/web start > /tmp/web.log 2>&1 &
          npx --yes wait-on@9.5.1 -t 90000 http://localhost:3001/api/health http://localhost:3000
          pnpm smoke --api http://localhost:3001 --web http://localhost:3000
        env:
          API_URL: http://localhost:3001

      - name: Logs dos processos quando o smoke falha
        if: failure()
        run: tail -n 40 /tmp/api.log /tmp/web.log || true
