name: CI

on:
  push:
    branches: [dev, main]
  pull_request:

# Nada neste pipeline escreve no repositório — só lê, instala e testa.
# Menor privilégio: um action comprometido não consegue push.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-build-test:
    runs-on: ubuntu-latest

    # Mesmo usuario e senha do docker-compose.yml da raiz (banco: prolobby_e2e) — se divergirem, aparece o
    # "funciona local, quebra no CI" que esta issue existe pra evitar (#67).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: prolobby
          POSTGRES_PASSWORD: prolobby
          # _e2e: the suites refuse any other name (test/support/guard-database.ts).
          POSTGRES_DB: prolobby_e2e
        ports:
          - 5432:5432
        # Sem o health check o job começa a testar com o banco ainda subindo,
        # e a falha é intermitente — a pior de diagnosticar.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://prolobby:prolobby@localhost:5432/prolobby_e2e
      # Descartavel e efemero no runner. O segredo real vive em variavel de
      # ambiente do deploy e forja sessao de qualquer conta (RNF-021).
      JWT_SECRET: ci-secret-not-the-placeholder
      WEBHOOK_SECRET: ci-webhook-secret-not-the-placeholder
      # 32 raw bytes, base64 — same discardable-runner rule as the two above.
      EVIDENCE_ENCRYPTION_KEY: 'MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE='
      IDENTITY_HMAC_SECRET: 'YWJjZGVmZ2hpamtsbW5vcHFyc3R1dnd4eXowMTIzNDU='

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Item 2 do checklist de segurança (docs/requisitos/08-seguranca-checklist.md):
      # dependência vulnerável entra pelo lockfile, não pelo código do PR.
      # --prod: o que roda em produção bloqueia o merge; advisory de dev dep
      # (vitest/vite) vira manutenção normal, não trava PR de regra de negócio.
      - run: pnpm audit --prod --audit-level=high

      - run: pnpm format:check

      - run: pnpm turbo lint

      - run: pnpm turbo type-check

      - run: pnpm turbo build

      - run: pnpm turbo test

      - run: pnpm exec playwright install --with-deps chromium
        working-directory: apps/web

      - run: pnpm turbo e2e
