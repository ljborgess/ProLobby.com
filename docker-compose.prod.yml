# Production topology — ADR-009 / #121.
#
# Used on the Oracle VM: `docker compose -f docker-compose.prod.yml up -d`.
# Local development keeps using docker-compose.yml (Postgres with a published
# port). This file must never include Postgres: the database is Neon.
#
# No `ports:` on any service. Breaking that rule does not fail the Compose
# file — it only makes CF-Connecting-IP forgeable (item 11). The unit test
# in apps/api/src/common/deploy/production-compose.spec.ts is what catches it.
#
# Browser traffic lands on Next.js. The Nest API and the bot stay on the
# Docker network: issue #87 made the browser speak only to same-origin
# `/api/*` on the web app. Routing `/api/*` at the tunnel to Nest would
# bypass that proxy. POST /events is not on the tunnel either.

name: prolobby

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: '3000'
      API_URL: http://api:3001
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 40s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runner
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: '3001'
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:?WEBHOOK_SECRET is required}
      BOT_WEBHOOK_URL: http://bot:3002/events
      EVIDENCE_ENCRYPTION_KEY: ${EVIDENCE_ENCRYPTION_KEY:?EVIDENCE_ENCRYPTION_KEY is required}
      EVIDENCE_DIR: /app/apps/api/uploads/account-recovery
      IDENTITY_HMAC_SECRET: ${IDENTITY_HMAC_SECRET:?IDENTITY_HMAC_SECRET is required}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:?DISCORD_CLIENT_ID is required}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:?DISCORD_CLIENT_SECRET is required}
      DISCORD_REDIRECT_URI: ${DISCORD_REDIRECT_URI:?DISCORD_REDIRECT_URI is required}
      # Resend (ADR-008). Missing here, the API refused to boot in production
      # anyway (mail.module.ts) — but nothing surfaced that until the process
      # actually tried (2026-09-23 review). Required at the compose level so
      # the failure is "container never starts", not "starts, then dies".
      RESEND_API_KEY: ${RESEND_API_KEY:?RESEND_API_KEY is required}
      MAIL_FROM: ${MAIL_FROM:?MAIL_FROM is required}
      # Management API only — does not wake the compute (ADR-009 / #123).
      NEON_API_KEY: ${NEON_API_KEY:-}
      NEON_PROJECT_ID: ${NEON_PROJECT_ID:-}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_REGION: ${BACKUP_S3_REGION:-sa-saopaulo-1}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_ACCESS_KEY: ${BACKUP_S3_ACCESS_KEY:-}
      BACKUP_S3_SECRET_KEY: ${BACKUP_S3_SECRET_KEY:-}
    # Account-recovery evidence (RF-025). Without a volume, every deploy
    # recreates the container and deletes the files their cases point at.
    volumes:
      - api-evidence:/app/apps/api/uploads
    depends_on:
      api-migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s

  # Daily encrypted pg_dump (RNF-007 / #123). Owner URL only — the API
  # process never sees DATABASE_DIRECT_URL. Not part of `up -d`: a looping
  # dump would keep Neon awake (ADR-009). Cron on the VM:
  #   docker compose -f docker-compose.prod.yml --profile backup run --rm api-backup
  # Restore into a **new** Neon project (first internal deploy):
  #   docker compose -f docker-compose.prod.yml --profile backup run --rm api-backup \
  #     node dist/common/backup/cli.js restore <object-key>
  api-backup:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: backup
    restart: 'no'
    profiles: [backup]
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_DIRECT_URL:?DATABASE_DIRECT_URL is required}
      EVIDENCE_ENCRYPTION_KEY: ${EVIDENCE_ENCRYPTION_KEY:?EVIDENCE_ENCRYPTION_KEY is required}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:?BACKUP_S3_ENDPOINT is required}
      BACKUP_S3_REGION: ${BACKUP_S3_REGION:-sa-saopaulo-1}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:?BACKUP_S3_BUCKET is required}
      BACKUP_S3_ACCESS_KEY: ${BACKUP_S3_ACCESS_KEY:?BACKUP_S3_ACCESS_KEY is required}
      BACKUP_S3_SECRET_KEY: ${BACKUP_S3_SECRET_KEY:?BACKUP_S3_SECRET_KEY is required}

  # Owner-role URL only. The API process itself never sees DATABASE_DIRECT_URL
  # — prolobby_app has no DDL (ADR-009 decision 1).
  api-migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runner
    restart: 'no'
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_DIRECT_URL:?DATABASE_DIRECT_URL is required}
    command: ['node_modules/.bin/mikro-orm', 'migration:up']

  bot:
    build:
      context: .
      dockerfile: apps/bot/Dockerfile
    restart: unless-stopped
    # PID 1 with no init ignores SIGTERM by kernel default (2026-09-23
    # review): `docker compose down`/restart was a hard SIGKILL after the 10s
    # grace period, every time, dropping in-flight work. `init: true` runs
    # tini as PID 1, which forwards the signal to Node's own handler
    # (index.ts) instead of eating it.
    init: true
    environment:
      NODE_ENV: production
      PORT: '3002'
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:?DISCORD_BOT_TOKEN is required}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:?WEBHOOK_SECRET is required}
      # The bot → API direction (RF-060, #150), the mirror of BOT_WEBHOOK_URL
      # above. Over the internal network, never through the tunnel: the default
      # is the bot's own loopback, which reaches nothing from inside a
      # container.
      API_BOT_EVENTS_URL: http://api:3001/api/bot-events
      # Required (2026-09-23 review — was optional). A bot invited to a second
      # guild, even by mistake, would otherwise let that guild's joins/leaves
      # block or free real accounts on this one.
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID:?DISCORD_GUILD_ID is required}
    # /health is loopback-only and unauthenticated on purpose (server.ts): it
    # reports gateway state, not business data, and only Compose calls it.
    # 503 while the gateway is down is what RF-060 needs — the bot must be
    # really connected, not just "the process exists" (issue #168).
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3002/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s

  cloudflared:
    image: cloudflare/cloudflared:2025.8.1
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:?CLOUDFLARE_TUNNEL_TOKEN is required}
    depends_on:
      web:
        condition: service_healthy
    # Ingress lives in the Cloudflare dashboard and must match
    # deploy/cloudflared.yml — hostname → web:3000, nothing else.

volumes:
  api-evidence:
